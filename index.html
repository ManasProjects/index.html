<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vehicle OSINT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--card:#12121a;--card2:#1a1a26;--border:#2a2a3d;
  --accent:#6c63ff;--green:#00d4aa;--red:#ff4757;--yellow:#ffa502;
  --text:#e8e8f0;--sub:#8888aa
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh}
.hero{background:linear-gradient(135deg,#0a0a0f,#12102a,#0a0a0f);padding:36px 20px 28px;text-align:center;border-bottom:1px solid var(--border)}
.logo{font-size:2.2rem;font-weight:800}.logo span{color:var(--accent)}
.tagline{color:var(--sub);margin-top:6px;font-size:.9rem}
.search-wrap{max-width:540px;margin:24px auto 0}
.search-box{display:flex;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 18px;align-items:center;transition:border-color .2s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:1.1rem;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.search-box input::placeholder{color:var(--sub);font-weight:400;letter-spacing:0;text-transform:none;font-size:.95rem}
.btn{background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;color:#fff;padding:10px 22px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.5;cursor:not-allowed}
.examples{margin-top:10px;color:var(--sub);font-size:.8rem}
.examples span{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:3px 10px;margin:3px;cursor:pointer;transition:border-color .2s}
.examples span:hover{border-color:var(--accent);color:var(--accent)}
.container{max-width:920px;margin:0 auto;padding:24px 14px}
.status{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:18px;display:none;align-items:center;gap:12px}
.status.show{display:flex}
.spinner{width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;animation:fadeUp .35s ease forwards;opacity:0}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(14px)}}
.card-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.card-body{padding:14px 16px}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.row:last-child{border-bottom:none}
.lbl{color:var(--sub);font-size:.8rem;flex:0 0 44%}
.val{font-size:.85rem;font-weight:600;text-align:right;word-break:break-word;flex:0 0 54%}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.78rem;font-weight:700}
.green{background:rgba(0,212,170,.12);color:var(--green);border:1px solid rgba(0,212,170,.25)}
.red{background:rgba(255,71,87,.12);color:var(--red);border:1px solid rgba(255,71,87,.25)}
.yellow{background:rgba(255,165,2,.12);color:var(--yellow);border:1px solid rgba(255,165,2,.25)}
.purple{background:rgba(108,99,255,.12);color:var(--accent);border:1px solid rgba(108,99,255,.25)}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:.82rem;font-weight:600}
.full{grid-column:1/-1}
.challan-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.challan-item:last-child{margin-bottom:0}
.ch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.err-card{background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.2);border-radius:14px;padding:24px;text-align:center;color:var(--red)}
.reg-hero{text-align:center;margin-bottom:18px}
.reg-plate{display:inline-block;background:var(--card2);border:2px solid var(--accent);border-radius:8px;padding:6px 20px;font-size:1.4rem;font-weight:800;letter-spacing:3px;color:var(--accent)}
.hint{background:rgba(108,99,255,.06);border:1px solid rgba(108,99,255,.15);border-radius:12px;padding:20px;text-align:center;margin-top:24px}
.hint p{color:var(--sub);font-size:.85rem;line-height:1.8}
.sec-title{font-size:.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin:20px 0 10px}
.footer{text-align:center;color:var(--sub);font-size:.75rem;padding:16px;border-top:1px solid var(--border);margin-top:20px}
@media(max-width:580px){.logo{font-size:1.7rem}.grid{grid-template-columns:1fr}.search-box input{font-size:.95rem}.btn{padding:10px 14px}}
</style>
</head>
<body>

<div class="hero">
  <div class="logo">🚗 Vehicle <span>OSINT</span></div>
  <div class="tagline">RC • PUC • Challan • FASTag • Insurance — Full Report</div>
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="inp" placeholder="Enter Registration No. (e.g. MH12AB1234)" maxlength="11" autocomplete="off"/>
      <button class="btn" id="searchBtn" onclick="doSearch()">🔍 Search</button>
    </div>
    <div class="examples">
      Try: <span onclick="fill('MH12AB1234')">MH12AB1234</span>
           <span onclick="fill('DL10CQ7777')">DL10CQ7777</span>
           <span onclick="fill('KA03MF4567')">KA03MF4567</span>
    </div>
  </div>
</div>

<div class="container">
  <div class="status" id="status"><div class="spinner"></div><span id="statusTxt">Fetching...</span></div>
  <div id="results"></div>
  <div class="hint" id="hint">
    <p>🔐 Enter any Indian vehicle registration number to get a complete report.<br>
    Data includes owner info, RC validity, insurance, PUC, challans & more.</p>
  </div>
</div>

<script>
/* ===================== DATA SOURCE (NEW API) ===================== */
const API_URL = 'https://ansh-apis.is-dev.org/api/vehileinfo';
const API_KEY = 'papa';

const $=id=>document.getElementById(id);

function fill(v){$('inp').value=v;doSearch()}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});

async function apiFetchVehicle(reg){
  try{
    const url=`${API_URL}?key=${encodeURIComponent(API_KEY)}&rc=${encodeURIComponent(reg)}`;
    const r=await fetch(url);
    if(!r.ok)return{_err:r.status};
    return await r.json();
  }catch(e){return{_err:String(e)}}
}

// Recursively finds the object inside the API response that actually holds
// the vehicle fields (handles nested / wrapped responses).
function findVehicleObj(obj){
  if(Array.isArray(obj)){
    for(const item of obj){const res=findVehicleObj(item);if(res)return res}
    return null
  }
  if(obj&&typeof obj==='object'){
    const vehicleKeys=['registrationNumber','reg_number','owner_name','rc_owner_name','make_name','model_name','vehicleClassDesc','fuelType'];
    if(vehicleKeys.some(k=>k in obj))return obj;
    for(const k in obj){
      const res=findVehicleObj(obj[k]);
      if(res)return res
    }
  }
  return null
}

async function doSearch(){
  const reg=$('inp').value.trim().toUpperCase().replace(/\s+/g,'');
  if(reg.length<6||reg.length>11){alert('Invalid format! Example: MH12AB1234');return}
  $('hint').style.display='none';
  $('results').innerHTML='';
  $('searchBtn').disabled=true;
  const st=$('status');st.className='status show';
  $('statusTxt').textContent=`Querying source for ${reg}...`;

  const raw=await apiFetchVehicle(reg);

  st.className='status';
  $('searchBtn').disabled=false;

  let vehicle=null;
  if(raw&&!raw._err&&raw.success!==false){
    // Normalize every important branch of the new API into the object
    // expected by the existing renderer, without changing the UI.
    const root = raw.data && typeof raw.data==='object' ? raw.data : raw;
    const g = root.garageVehicle360 || raw.garageVehicle360 || {};
    const summary = g.rc_summary || root.rc_summary || raw.rc_summary || {};
    const auth = root.authUserData || raw.authUserData || {};
    const authData = auth.data || {};
    const phoneFromApi =
      authData.phone ||
      authData.phone_with_country_code?.number ||
      auth.phone ||
      auth.phone_with_country_code?.number ||
      raw.phone ||
      raw.mobile ||
      raw.mobile_no ||
      raw.maskedPhone ||
      null;
    const eligibility = root.insuranceEligibility || raw.insuranceEligibility || {};
    const garageExists = root.garageVehicleExists || raw.garageVehicleExists || {};

    vehicle = {
      ...summary,
      ...g,

      // Top-level / report fields
      success: raw.success,
      statusCode: raw.statusCode,
      theme: raw.theme,
      backgroundColor: raw.backgroundColor,
      searchBar: raw.searchBar,
      tabs: raw.tabs,
      items: raw.items,
      title: raw.title,
      url: raw.url,
      subTitle: raw.subTitle,
      showBottomBanner: raw.showBottomBanner,
      isSeo: raw.isSeo,
      showSearchBar: raw.showSearchBar,
      titleHeaderProps: raw.titleHeaderProps,
      variant: raw.variant,
      hideOnScroll: raw.hideOnScroll,
      hideChipIcons: raw.hideChipIcons,
      backgroundMedia: raw.backgroundMedia,
      alt: raw.alt,
      type: raw.type,
      description: raw.description,
      pageSectionId: raw.pageSectionId,
      platform: raw.platform,
      sectionType: raw.sectionType,
      iid: raw.iid,
      widgetKey: raw.widgetKey,
      isActive: raw.isActive,
      label: raw.label,
      isOverridden: raw.isOverridden,

      // Owner / RTO
      owner_name: summary.owner_name || g.owner_name || raw["Owner's name"] || raw.owner_name,
      rc_owner_name: g.rc_owner_name || summary.owner_name || raw.rc_owner_name,
      owner_count: summary.owner_count || g.owner_count || raw.rc_owner_sr,
      ownership: raw.Ownership,
      rto: g.rto || summary.rto || raw.RTO,
      rto_name: summary.rto_name || g.rto || raw.RTO,
      rto_code: summary.rto_code || g.rto_code || raw.rto_code,
      registeredPlace: raw.registeredPlace,

      // Lead / challan metadata
      leadToken: raw.leadToken,
      challan: raw.challan,
      message: raw.message,
      status: raw.status,
      detail: raw.detail,
      regNumber: raw.regNumber,
      code: raw.code,
      lead: raw.lead,
      name: raw.name,
      leadType: raw.type,
      maskedPhone: raw.maskedPhone,
      prosLeadId: raw.prosLeadId,
      token: raw.token,

      // Vehicle specs
      make_name: summary.make_name || g.make_display || g.brand || raw.Manufacturer,
      model_name: summary.model_name || g.make_display || raw.Model,
      model_display: g.make_display || summary.model_name || raw.Model,
      variant: raw.Variant || g.variant || summary.variant,
      vehicle_class: summary.vehicle_class || raw.Class || raw.vehicleClassDesc,
      vehicleClassDesc: raw.vehicleClassDesc,
      fuel_type: summary.fuel_type || g.fuelType || raw["Fuel type"],
      fuelType: g.fuelType || summary.fuel_type || raw["Fuel type"],
      emission_norm: summary.emission_norm || raw["Emission norm"],
      rcNormsDesc: raw.rcNormsDesc,
      seat_capacity: summary.seat_capacity || g.seatCap || raw["Seating capacity"],
      seating_capacity: raw["Seating capacity"],
      cylinders_no: summary.cylinders_no || g.cylindersCount || raw["Number of cylinders"],
      cylindersCount: g.cylindersCount || summary.cylinders_no,
      cubic_capacity: summary.cubic_capacity || raw.cubicCapacity || raw["Cubic capacity"],
      cubicCapacity: raw.cubicCapacity || summary.cubic_capacity,
      vehicle_category: summary.vehicle_category || raw.vehicleCategory,
      vehicleCategory: raw.vehicleCategory || summary.vehicle_category,
      vehicle_color: summary.vehicle_color || g.color || raw.color,
      color: g.color || summary.vehicle_color,
      manufacturer_month_year: summary.manufacturer_month_year || g.manufacturingMonthYr,
      manufacturingMonthYr: g.manufacturingMonthYr,

      // Engine / chassis
      engine_number: summary.engine_number || raw.engineNo || raw["Engine number"],
      engineNo: raw.engineNo || summary.engine_number,
      chassis_number: summary.chassis_number || raw.chassisNo || raw["Chassis number"],
      chassisNo: raw.chassisNo || summary.chassis_number,

      // Dates / RC / insurance / pollution
      registrationNumber: g.registrationNumber || summary.reg_number || raw.registration_number || reg,
      registration_number: raw.registration_number || g.registrationNumber || reg,
      reg_number: summary.reg_number || g.registrationNumber || reg,
      registeredAt: g.registeredAt || summary.registration_date,
      registration_date: summary.registration_date || raw["Registration date"],
      fitness_upto: summary.fitness_upto || g.fitnessUpTo || raw["Fitness upto"],
      fitnessUpTo: g.fitnessUpTo || summary.fitness_upto,
      rc_expiry_date: summary.rc_expiry_date || g.rcExpiryDate || raw["RC expiry date"],
      rcExpiryDate: g.rcExpiryDate || summary.rc_expiry_date,
      rc_status: summary.rc_status || raw.rcStatus || raw["RC status"],
      rcStatus: raw.rcStatus || summary.rc_status,
      insurance_expiry: summary.insurance_expiry || g.insuranceUpTo || raw["Insurance validity"],
      insuranceUpTo: g.insuranceUpTo || summary.insurance_expiry,
      insuranceCompany: g.insuranceCompany || summary.insurance_company || raw.insuranceCompany,
      insurance_company: g.insuranceCompany || summary.insurance_company,
      pollution_validity: raw["Pollution validity (PUCC)"],
      vehicle_age: raw["Vehicle age"],

      // Finance
      financer: summary.financer || raw["Financier name"],
      financier: summary.financer || raw["Financier name"],

      // Insurance eligibility
      insuranceEligibility: eligibility,
      affiliateUrl: eligibility.affiliateUrl,
      eligiblePartnerCount: eligibility.eligiblePartnerCount,
      eligibilityResponse: eligibility.eligibilityResponse,
      daysLeft: eligibility.daysLeft,
      eligible: eligibility.eligible,
      directRedirection: eligibility.directRedirection,
      insuranceStatus: eligibility.status,
      isBike: eligibility.isBike,

      // Garage
      garageVehicleExists: garageExists,
      exists: garageExists.exists,
      garageVehicle360: g,
      rc_summary: summary,

      // Auth user data
      authUserData: auth,
      user_id: auth.user_id,
      phone: phoneFromApi,
      updated_at: auth.updated_at,
      user_address_consent: auth.user_address_consent,
      user_type: auth.user_type,
      phone_with_country_code: auth.phone_with_country_code,
      country_code: auth.country_code || auth.phone_with_country_code?.country_code,
      number: authData.phone_with_country_code?.number || auth.phone_with_country_code?.number,
      whatsapp_consent: auth.whatsapp_consent,
      created_at: auth.created_at,
      client_id: auth.client_id,

      // Misc
      credit: raw.credit,
      mobile: phoneFromApi,
      mobile_no: phoneFromApi,

      // Keep the COMPLETE untouched API response available to the page.
      __api: raw
    };
  }

  if(!vehicle){
    vehicle={_err:(raw&&(raw.message||raw.error))||true,__api:raw};
  }

  // Last-resort recursive phone lookup for differently wrapped API responses.
  if(vehicle && !vehicle.mobile){
    const findPhone = (obj, seen=new Set()) => {
      if(!obj || typeof obj!=='object' || seen.has(obj)) return null;
      seen.add(obj);
      if(Array.isArray(obj)){
        for(const x of obj){ const p=findPhone(x,seen); if(p) return p; }
        return null;
      }
      for(const k of Object.keys(obj)){
        const key=k.toLowerCase().replace(/[^a-z0-9]/g,'');
        const value=obj[k];
        if(['phone','mobileno','mobile','phonenumber'].includes(key) &&
           value!=null && String(value).trim()!=='') return value;
        const p=findPhone(value,seen);
        if(p) return p;
      }
      return null;
    };
    vehicle.mobile=findPhone(raw);
    vehicle.mobile_no=vehicle.mobile;
  }

  // Existing UI renderer is unchanged.
  render(reg,vehicle,vehicle,null,null,vehicle);

  // Do not alter the existing report layout. Make the complete response
  // available programmatically for any field not used by the visual cards.
  window.lastVehicleApiResponse = raw;
}
/* =================== END DATA SOURCE (NEW API) ==================== */

function ok(v){return v&&!v._err}
function sg(d,...ks){
  if(!d||typeof d!=='object')return null;
  for(const k of ks){const v=d[k];if(v!=null&&String(v).trim()!==''&&!['None','null','NA','N/A','none','undefined'].includes(String(v).trim()))return v}
  return null
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtDate(ds){
  if(!ds)return null;
  const s=String(ds).split('T')[0];
  const mo={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  let d;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))d=new Date(s);
  else if(/^\d{2}-[A-Za-z]{3}-\d{4}$/.test(s)){const[dd,mm,yy]=s.split('-');d=new Date(+yy,mo[mm],+dd)}
  else if(/^\d{2}[-\/]\d{2}[-\/]\d{4}$/.test(s)){const p=s.split(/[-\/]/);d=new Date(+p[2],+p[1]-1,+p[0])}
  else d=new Date(s);
  if(isNaN(d))return ds;
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})
}
function isExp(ds){
  if(!ds)return null;
  const s=String(ds).split('T')[0];
  const mo={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  let d;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))d=new Date(s);
  else if(/^\d{2}-[A-Za-z]{3}-\d{4}$/.test(s)){const[dd,mm,yy]=s.split('-');d=new Date(+yy,mo[mm],+dd)}
  else if(/^\d{2}[-\/]\d{2}[-\/]\d{4}$/.test(s)){const p=s.split(/[-\/]/);d=new Date(+p[2],+p[1]-1,+p[0])}
  else d=new Date(s);
  if(isNaN(d))return null;
  return d<new Date()
}
function vbadge(ds){
  const e=isExp(ds),fd=fmtDate(ds)||ds;
  if(e===true)return`<span class="badge red">🔴 ${esc(fd)} Expired</span>`;
  if(e===false)return`<span class="badge green">🟢 ${esc(fd)} Valid</span>`;
  return`<span class="tag">${esc(fd)}</span>`
}
function row(l,v,html=false){
  if(v==null||v===''||v===undefined)return'';
  return`<div class="row"><span class="lbl">${l}</span><span class="val">${html?v:esc(String(v))}</span></div>`
}
function vage(ds){
  if(!ds)return null;
  const mo={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  let d;
  const s=String(ds).split('T')[0];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))d=new Date(s);
  else if(/^\d{2}-[A-Za-z]{3}-\d{4}$/.test(s)){const[dd,mm,yy]=s.split('-');d=new Date(+yy,mo[mm],+dd)}
  else if(/^\d{2}[-\/]\d{2}[-\/]\d{4}$/.test(s)){const p=s.split(/[-\/]/);d=new Date(+p[2],+p[1]-1,+p[0])}
  else d=new Date(s);
  if(isNaN(d))return null;
  const diff=Date.now()-d,y=Math.floor(diff/31557600000),m=Math.floor((diff%31557600000)/2629800000);
  return`${y} Yrs ${m} Mo`
}
function pucDict(raw){
  if(!raw||raw._err)return null;
  if(Array.isArray(raw))return raw[0]||null;
  for(const k of['pucDetails','data','pucs']){const v=raw[k];if(v){if(Array.isArray(v)&&v.length)return v[0];if(typeof v==='object')return v}}
  return raw
}

function render(reg,vd,pd,cd,ftd,vsd){
  if(!ok(vd)&&!ok(pd)&&!ok(cd)){
    $('results').innerHTML=`<div class="err-card">❌ No data found for <strong>${esc(reg)}</strong><br><small style="opacity:.7">Check registration number or update cookies in backend.</small></div>`;
    return
  }

  let vs={};
  if(ok(vsd)){vs=vsd.data||vsd.vehicle||vsd||{};if(Array.isArray(vs))vs=vs[0]||{};if(typeof vs!=='object')vs={}}

  let h='';
  h+=`<div class="reg-hero"><div class="reg-plate">${esc(reg)}</div></div>`;
  h+=`<div class="grid">`;

  if(ok(vd)){
    const owner=sg(vd,'owner_name','rc_owner_name'),regNo=sg(vd,'asset_number','registrationNumber','reg_number')||reg;
    const father=sg(vd,'father_name','fatherName')||sg(vs,'father_name','fatherName');
    const mobile=sg(vd,'mobile_no','mobileNo','mobile')||sg(vs,'mobile_no','mobileNo');
    const ownerCnt=sg(vd,'owner_count','rc_owner_sr');
    const isComm=vd.is_commercial?'Yes':'No';
    const regDate=sg(vd,'registration_date','registeredAt');
    const regY=sg(vd,'registration_year'),regM=sg(vd,'registration_month');
    const rcStat=sg(vs,'rc_status','rcStatus')||sg(vd,'rc_status','rcStatus')||'ACTIVE';
    const rcBadge=rcStat.toUpperCase().includes('ACTIVE')||rcStat.toUpperCase().includes('VALID')
      ?`<span class="badge green">✅ ${esc(rcStat)}</span>`
      :`<span class="badge red">❌ ${esc(rcStat)}</span>`;

    h+=`<div class="card" style="animation-delay:.05s">
      <div class="card-head">👤 Owner Details</div>
      <div class="card-body">
        ${row('Owner Name',owner||'N/A')}
        ${father?row('Father/Husband',father):''}
        ${mobile?row('Mobile No',mobile):''}
        ${row('Owner Count',ownerCnt||'1')}
        ${row('Commercial',isComm)}
        ${row('RC Status',rcBadge,true)}
        ${row('Reg. Date',fmtDate(regDate)||regDate||'N/A')}
        ${row('Vehicle Age',vage(regDate)||'N/A')}
        ${row('Reg. Year/Month',(regY||'?')+' / '+(regM||'?'))}
      </div></div>`;

    const make=sg(vd,'make_name')||sg(vs,'make','maker');
    const make2=sg(vd,'make_name2');
    const model=sg(vd,'model_name','model_display')||sg(vs,'model');
    const model2=sg(vd,'model_name2');
    const makeModel=sg(vd,'make_model');
    const fuel=sg(vd,'fuel_type','fuelType');
    const color=sg(vs,'color','colour')||sg(vd,'color','vehicle_color');
    const variant=sg(vs,'variant')||sg(vd,'variant','variantName','variant_name');
    const bodyType=sg(vs,'body_type','bodyType');
    const mfgY=sg(vs,'manufacturing_year','mfgYear')||sg(vd,'manufacturing_year','manufacturingMonthYr','manufacturer_month_year');
    const emission=sg(vs,'emission_norms','norms_type')||sg(vd,'emission_norms','rcNormsDesc','emission_norm');
    const seating=sg(vs,'seating_capacity')||sg(vd,'seating_capacity','seatCap','seat_capacity');
    const cc=sg(vs,'cubic_cap','cc')||sg(vd,'cubic_cap','cubicCapacity','cubic_capacity');
    const wbase=sg(vs,'wheelbase')||sg(vd,'wheelbase');
    const grossWt=sg(vs,'gross_weight')||sg(vd,'gross_weight');
    const cylinders=sg(vs,'no_of_cylinder')||sg(vd,'no_of_cylinder','cylindersCount','cylinders_no');

    h+=`<div class="card" style="animation-delay:.08s">
      <div class="card-head">🔧 Vehicle Specs</div>
      <div class="card-body">
        ${row('Make',make||'N/A')}
        ${make2&&make2!==make?row('Make (Full)',make2):''}
        ${row('Model',model||'N/A')}
        ${model2&&model2!==model?row('Model (Full)',model2):''}
        ${makeModel?row('Make/Model',makeModel):''}
        ${variant?row('Variant',variant):''}
        ${color?row('Color',color):''}
        ${bodyType?row('Body Type',bodyType):''}
        ${mfgY?row('Mfg. Year',mfgY):''}
        ${row('Fuel Type',fuel||'N/A')}
        ${emission?row('Emission Norms',emission):''}
        ${seating?row('Seating Cap.',seating+' seats'):''}
      </div></div>`;

    const engNo=sg(vd,'engine_number','engineNo'),chsNo=sg(vd,'chassis_number','chassisNo');
    h+=`<div class="card" style="animation-delay:.11s">
      <div class="card-head">⚙️ Engine & Chassis</div>
      <div class="card-body">
        ${row('Engine No',engNo||'N/A')}
        ${row('Chassis No',chsNo||'N/A')}
        ${cylinders?row('Cylinders',cylinders):''}
        ${cc?row('Engine CC',cc+' cc'):''}
        ${wbase?row('Wheelbase',wbase+' mm'):''}
        ${grossWt?row('Gross Weight',grossWt+' kg'):''}
      </div></div>`;

    const rcExp=sg(vs,'rc_expiry','rcExpiry','reg_upto')||sg(vd,'rc_upto','rcExpiryDate','rc_expiry_date');
    const fitness=sg(vs,'fitness_upto','fitnessUpto')||sg(vd,'fitness_upto','fitnessUpTo');
    const roadTax=sg(vs,'mv_tax_upto','mvTaxUpto','tax_upto')||sg(vd,'mv_tax_upto');
    const permitType=sg(vs,'permit_type')||sg(vd,'permit_type');
    const permitNo=sg(vs,'permit_no')||sg(vd,'permit_no');
    const permitUpto=sg(vs,'permit_upto')||sg(vd,'permit_upto');
    const bl=sg(vs,'blacklist_status')||sg(vd,'blacklist_status');
    const blStr=bl?String(bl).toUpperCase():'';
    const blBadge=bl?(['YES','TRUE','1','LISTED','BLACKLIST'].some(x=>blStr.includes(x))
      ?'<span class="badge red">🔴 BLACKLISTED</span>'
      :'<span class="badge green">✅ Not Blacklisted</span>'):'';
    const noc=sg(vs,'noc_details','noc_status')||sg(vd,'noc_details','noc');

    h+=`<div class="card" style="animation-delay:.14s">
      <div class="card-head">📋 RC & Compliance</div>
      <div class="card-body">
        ${rcExp?row('RC Valid Upto',vbadge(rcExp),true):''}
        ${fitness?row('Fitness Upto',vbadge(fitness),true):''}
        ${roadTax?row('Road Tax Upto',vbadge(roadTax),true):''}
        ${permitType?row('Permit Type',permitType):''}
        ${permitNo?row('Permit No',permitNo):''}
        ${permitUpto?row('Permit Upto',vbadge(permitUpto),true):''}
        ${blBadge?row('Blacklist',blBadge,true):''}
        ${noc?row('NOC Status',noc):''}
        ${!rcExp&&!fitness&&!roadTax&&!bl?'<div style="color:var(--sub);font-size:.82rem;padding:8px 0">ℹ️ Compliance data not available</div>':''}
      </div></div>`;

    const insExp=sg(vd,'previous_policy_expiry_date','insuranceUpTo','insurance_expiry');
    const expFlag=vd.previous_policy_expired;
    const insurer=sg(vd,'previous_insurer','insuranceCompany','insurance_company');
    const financer=sg(vs,'financier','financer')||sg(vd,'financier','financer');
    const hpStat=sg(vs,'hp_status','hpStatus');
    const insBadge=expFlag===false?'<span class="badge green">🟢 Active</span>':
                   expFlag===true?'<span class="badge red">🔴 Expired</span>':
                   isExp(insExp)===false?'<span class="badge green">🟢 Active</span>':
                   isExp(insExp)===true?'<span class="badge red">🔴 Expired</span>':
                   '<span class="badge yellow">⚪ Unknown</span>';

    h+=`<div class="card" style="animation-delay:.17s">
      <div class="card-head">🛡️ Insurance</div>
      <div class="card-body">
        ${row('Status',insBadge,true)}
        ${insurer?row('Insurer',insurer):''}
        ${insExp?row('Expiry Date',fmtDate(insExp)||insExp):''}
        ${row('Policy Expired',expFlag?'🔴 Yes':'🟢 No')}
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:.75rem;color:var(--sub);font-weight:700;letter-spacing:1px;margin-bottom:6px">FINANCE / LOAN</div>
        ${financer
          ?row('Financer',financer)+(hpStat?row('HP Status',hpStat):'')
          :'<div style="color:var(--green);font-size:.84rem">✅ No Loan / Hypothecation</div>'}
      </div></div>`;

    const rtoOff=sg(vd,'registration_address','rto','rto_name','registeredPlace'),permAddr=sg(vd,'permanent_address');
    const presAddr=sg(vd,'present_address'),state=sg(vs,'state','state_name')||sg(vd,'state');
    const rtoCode=sg(vs,'rto_code')||sg(vd,'rto_code','rtoCode');
    h+=`<div class="card" style="animation-delay:.2s">
      <div class="card-head">📍 Address & RTO</div>
      <div class="card-body">
        ${rtoOff?row('RTO Office',rtoOff):''}
        ${rtoCode?row('RTO Code',rtoCode):''}
        ${state?row('State',state):''}
        ${permAddr?row('Permanent Address',permAddr):''}
        ${presAddr&&presAddr!==permAddr?row('Present Address',presAddr):''}
        ${!rtoOff&&!state&&!permAddr?'<div style="color:var(--sub);font-size:.82rem">ℹ️ Address data not available</div>':''}
      </div></div>`;
  }

  const p=pucDict(pd);
  if(p){
    const pucUpto=sg(p,'expiry_date','valid_upto','validUpto','toDate','expiryDate','pucc_upto','pucUpTo','pucc_expiry','puc_expiry');
    const pucIssue=sg(p,'issue_date','valid_from','validFrom','fromDate','pucc_from');
    const pucNo=sg(p,'number','puc_number','pucNo','pucCertNo','certificateNo','pucc_no');
    const pucCenter=sg(p,'test_center','testCenter','puccCenter','center_name');
    const pucActive=p.active;
    const pucBadge=pucActive===true?'<span class="badge green">🟢 Active</span>':
                   pucActive===false?'<span class="badge red">🔴 Expired</span>':
                   isExp(pucUpto)===false?'<span class="badge green">🟢 Active</span>':
                   isExp(pucUpto)===true?'<span class="badge red">🔴 Expired</span>':
                   '<span class="badge yellow">🟡 Unknown</span>';
    h+=`<div class="card" style="animation-delay:.23s">
      <div class="card-head">💨 PUC / Pollution</div>
      <div class="card-body">
        ${row('Status',pucBadge,true)}
        ${pucNo?row('Certificate No',pucNo):''}
        ${pucIssue?row('Issue Date',fmtDate(pucIssue)||pucIssue):''}
        ${pucUpto?row('Expiry Date',vbadge(pucUpto),true):''}
        ${pucCenter?row('Test Center',pucCenter):''}
      </div></div>`;
  } else {
    h+=`<div class="card" style="animation-delay:.23s">
      <div class="card-head">💨 PUC / Pollution</div>
      <div class="card-body"><div style="color:var(--sub);font-size:.85rem">❓ PUC data not available</div></div></div>`;
  }

  let ft=null;
  if(ok(ftd)){ft=ftd.data||ftd.fastag||ftd;if(Array.isArray(ft)&&ft.length)ft=ft[0];if(typeof ft!=='object')ft=null}
  if(ft){
    const ftStat=sg(ft,'status','fastag_status','fastagStatus');
    const ftActive=ft.active||ft.is_active;
    const ftBank=sg(ft,'bank','bank_name','bankName','issuer_bank','issuerBank');
    const ftWallet=sg(ft,'wallet_balance','balance','walletBalance','available_balance');
    const ftTag=sg(ft,'tag_id','tagId','fastag_id','fastagId','tid');
    const ftKyc=sg(ft,'kyc_status','kycStatus','kyc');
    const ftBadge=(ftActive===true||(ftStat&&['ACTIVE','LINKED','YES'].some(x=>String(ftStat).toUpperCase().includes(x))))
      ?'<span class="badge green">🟢 Active</span>'
      :`<span class="badge red">🔴 ${esc(ftStat||'Inactive')}</span>`;
    h+=`<div class="card" style="animation-delay:.26s">
      <div class="card-head">🏷️ FASTag</div>
      <div class="card-body">
        ${row('Status',ftBadge,true)}
        ${ftBank?row('Issuing Bank',ftBank):''}
        ${ftTag?row('Tag ID',ftTag):''}
        ${ftWallet?row('Wallet Balance','₹'+ftWallet):''}
        ${ftKyc?row('KYC Status',ftKyc):''}
      </div></div>`;
  }

  h+=`</div>`;

  let challans=[];
  if(ok(cd)){
    const cdata=cd.challanData;
    if(cdata){
      const raw=Array.isArray(cdata)?cdata:cdata.challans||cdata.data||[cdata];
      challans=raw.filter(c=>c&&typeof c==='object');
    }
  }

  h+=`<div class="sec-title">📑 Challan Details</div>`;
  if(!challans.length){
    h+=`<div class="card full"><div class="card-body" style="text-align:center;padding:18px"><span class="badge green" style="font-size:.92rem">🟢 No Pending Challans Found</span></div></div>`;
  } else {
    let total=0;
    h+=`<div class="card full"><div class="card-head">⚠️ ${challans.length} Challan(s) Found</div><div class="card-body">`;
    challans.forEach((c,i)=>{
      const cno=sg(c,'challan_number','challanNo','challan_id','id');
      const cdate=fmtDate(sg(c,'challan_date','challanDate','date','violation_date'));
      const cstat=sg(c,'status','payment_status','paymentStatus','challan_status');
      const amt=sg(c,'amount','fine_amount','fineAmount','penalty');
      const paybl=sg(c,'amount_after_discount','payableAmount','payable_amount');
      const offnce=sg(c,'offence','offence_name','violation','offense_desc','offenceDesc');
      const loc=sg(c,'location','place','violation_place','offence_place');
      const court=sg(c,'court','court_name');
      const crtDt=fmtDate(sg(c,'court_date','courtDate','hearing_date'));
      const cs=cstat?String(cstat).toUpperCase():'';
      const cb=['PAID','CLEAR','DISPOSED'].some(x=>cs.includes(x))?'green':['PENDING','UNPAID','DUE'].some(x=>cs.includes(x))?'red':'yellow';
      try{total+=parseFloat(String(amt||paybl||'0').replace(/[₹,]/g,''))}catch(e){}
      h+=`<div class="challan-item">
        <div class="ch-head">
          <strong style="font-size:.9rem">Challan #${i+1}${cno?' · <span style="font-weight:400">'+esc(cno)+'</span>':''}</strong>
          ${cstat?`<span class="badge ${cb}">${esc(cstat)}</span>`:''}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.82rem;color:var(--sub)">
          ${cdate?`<div>📅 ${cdate}</div>`:''}
          ${amt?`<div style="color:var(--text)">💸 ₹${esc(String(amt))}</div>`:''}
          ${paybl?`<div style="color:var(--text)">💰 Payable: ₹${esc(String(paybl))}</div>`:''}
          ${offnce?`<div style="grid-column:1/-1">⚖️ ${esc(offnce)}</div>`:''}
          ${loc?`<div style="grid-column:1/-1">📍 ${esc(loc)}</div>`:''}
          ${court?`<div style="grid-column:1/-1">🏛️ ${esc(court)}</div>`:''}
          ${crtDt?`<div>Court Date: ${crtDt}</div>`:''}
        </div>
      </div>`;
    });
    if(total>0)h+=`<div style="text-align:right;font-weight:700;color:var(--red);padding-top:10px">💰 Total Pending Fine: ₹${total.toLocaleString('en-IN')}</div>`;
    h+=`</div></div>`;
  }

  h+=`<div class="footer">Report generated at ${new Date().toLocaleString('en-IN')} | Vehicle OSINT</div>`;
  $('results').innerHTML=h;
}
</script>

<script>
/*
 * COMPLETE NEW-API RESPONSE
 * After a search, the untouched JSON response is available as:
 *   window.lastVehicleApiResponse
 *
 * This intentionally keeps the existing visual UI unchanged while retaining
 * every API field, including nested objects/arrays.
 */
window.getCompleteVehicleResponse = function(){
  return window.lastVehicleApiResponse || null;
};
window.copyCompleteVehicleResponse = async function(){
  const data = window.getCompleteVehicleResponse();
  if(!data){ return false; }
  try{
    await navigator.clipboard.writeText(JSON.stringify(data,null,2));
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
};
</script>

</body>
</html>
